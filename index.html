<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apps for the Masses</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            min-height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #30343b;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(255, 242, 195, 0.38),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 88% 18%,
                    rgba(202, 229, 248, 0.48),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 78% 88%,
                    rgba(228, 218, 248, 0.38),
                    transparent 28%
                ),
                linear-gradient(
                    135deg,
                    #fbfdfd 0%,
                    #f3f8fa 50%,
                    #fbf9fd 100%
                );
        }

        /* ---------------------------------------------
           SUBTLE CLOUDS
           --------------------------------------------- */

        body::before,
        body::after {
            content: "";
            position: fixed;
            pointer-events: none;
            z-index: -1;
            filter: blur(12px);
            opacity: 0.28;
        }

        body::before {
            width: 230px;
            height: 110px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.8);
            top: 13%;
            left: -90px;

            box-shadow:
                70px 10px 0 rgba(255, 255, 255, 0.65),
                135px -8px 0 rgba(255, 255, 255, 0.55);
        }

        body::after {
            width: 250px;
            height: 115px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.7);
            right: -100px;
            bottom: 14%;

            box-shadow:
                -70px 12px 0 rgba(255, 255, 255, 0.55),
                -140px -8px 0 rgba(255, 255, 255, 0.5);
        }

        /* ---------------------------------------------
           VERY SUBTLE GLIMMERS
           --------------------------------------------- */

        .sparkle {
            position: fixed;
            width: 3px;
            height: 3px;
            border-radius: 50%;

            background: rgba(245, 216, 132, 0.52);

            box-shadow:
                0 0 6px rgba(245, 216, 132, 0.28);

            pointer-events: none;
            z-index: -1;

            animation: shimmer 5s ease-in-out infinite;
        }

        .sparkle.one {
            top: 23%;
            left: 18%;
            animation-delay: 0s;
        }

        .sparkle.two {
            top: 67%;
            right: 17%;
            width: 2px;
            height: 2px;
            animation-delay: 2s;
        }

        .sparkle.three {
            top: 42%;
            right: 9%;
            width: 2px;
            height: 2px;
            animation-delay: 3.5s;
        }

        @keyframes shimmer {
            0%, 100% {
                opacity: 0.12;
                transform: scale(0.8);
            }

            50% {
                opacity: 0.55;
                transform: scale(1.3);
            }
        }

        /* ---------------------------------------------
           PAGE
           --------------------------------------------- */

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 85px 24px;
        }

        /* ---------------------------------------------
           HEADER
           --------------------------------------------- */

        header {
            text-align: center;
            margin-bottom: 55px;
        }

        h1 {
            font-size: 54px;
            font-weight: 800;
            letter-spacing: -2px;
            color: #2f343b;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 18px;
            color: #7b858f;
        }

        /* ---------------------------------------------
           APP LAYOUT
           --------------------------------------------- */

        .apps {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* ---------------------------------------------
           JELLY / GLASS CARDS
           --------------------------------------------- */

        .card {
            position: relative;
            overflow: hidden;

            background: rgba(255, 255, 255, 0.64);

            border: 1px solid rgba(255, 255, 255, 0.88);
            border-radius: 30px;

            padding: 38px;

            box-shadow:
                0 18px 45px rgba(86, 110, 130, 0.09),
                inset 0 1px 0 rgba(255, 255, 255, 0.95);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 24px 50px rgba(86, 110, 130, 0.13),
                inset 0 1px 0 rgba(255, 255, 255, 1);
        }

        /* ---------------------------------------------
           FEATURED REELLYY CARD
           --------------------------------------------- */

        .featured {
            padding: 48px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.82),
                    rgba(255, 249, 229, 0.68)
                );
        }

        .featured::after {
            content: "";
            position: absolute;

            width: 220px;
            height: 220px;

            border-radius: 50%;

            background: rgba(248, 224, 147, 0.11);

            right: -75px;
            top: -95px;

            filter: blur(8px);
        }

        /* ---------------------------------------------
           ICONS
           --------------------------------------------- */

        .icon {
            width: 62px;
            height: 62px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            background: rgba(255, 255, 255, 0.76);

            font-size: 30px;

            margin-bottom: 23px;

            box-shadow:
                0 8px 20px rgba(90, 110, 125, 0.09),
                inset 0 1px 1px rgba(255, 255, 255, 0.95);
        }

        .featured .icon {
            background:
                linear-gradient(
                    145deg,
                    #fff9e8,
                    #f8e7a6
                );

            box-shadow:
                0 10px 22px rgba(220, 192, 108, 0.14),
                inset 0 2px 2px rgba(255, 255, 255, 0.8);
        }

        /* ---------------------------------------------
           TEXT
           --------------------------------------------- */

        h2 {
            font-size: 32px;
            font-weight: 750;
            letter-spacing: -0.8px;
            margin-bottom: 10px;
        }

        .description {
            color: #707b85;
            line-height: 1.65;
            font-size: 17px;
            max-width: 650px;
            margin-bottom: 28px;
        }

        /* ---------------------------------------------
           JELLY BUTTONS
           --------------------------------------------- */

        .button {
            display: inline-block;

            background:
                linear-gradient(
                    145deg,
                    #fff3c4,
                    #f8e7a6
                );

            color: #514b3a;

            text-decoration: none;

            padding: 13px 22px;

            border-radius: 15px;

            font-weight: 750;

            box-shadow:
                0 7px 16px rgba(214, 190, 113, 0.15),
                inset 0 2px 2px rgba(255, 255, 255, 0.8);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .button:hover {
            transform: translateY(-2px);

            background:
                linear-gradient(
                    145deg,
                    #fff7d7,
                    #f6e1a0
                );

            box-shadow:
                0 10px 22px rgba(214, 190, 113, 0.20),
                inset 0 2px 2px rgba(255, 255, 255, 0.85);
        }

        /* ---------------------------------------------
           WANDER
           --------------------------------------------- */

        .wander-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.68),
                    rgba(237, 246, 255, 0.64)
                );
        }

        .wander-content {
            flex: 1;
        }

        .wander-card h2 {
            font-size: 28px;
        }

        .wander-card .description {
            margin-bottom: 0;
        }

        .wander-card .button {
            flex-shrink: 0;
        }

        /* ---------------------------------------------
           FOOTER
           --------------------------------------------- */

        footer {
            text-align: center;
            margin-top: 55px;
            color: #9aa4ad;
            font-size: 14px;
        }

        /* ---------------------------------------------
           MOBILE
           --------------------------------------------- */

        @media (max-width: 650px) {

            .container {
                padding: 60px 20px;
            }

            h1 {
                font-size: 42px;
            }

            .featured {
                padding: 34px;
            }

            .card {
                border-radius: 25px;
            }

            .wander-card {
                flex-direction: column;
                align-items: flex-start;
            }

            .wander-card .button {
                margin-top: 5px;
            }
        }
    </style>
</head>

<body>

    <!-- Tiny background glimmers -->
    <div class="sparkle one"></div>
    <div class="sparkle two"></div>
    <div class="sparkle three"></div>

    <div class="container">

        <header>
            <h1>My Apps</h1>
            <p class="subtitle">A collection of things I've built.</p>
        </header>

        <main class="apps">

            <!-- Featured App: Reellyy -->
            <div class="card featured">

                <div class="icon">🎬</div>

                <h2>Reellyy</h2>

                <p class="description">
                    A streaming service optimizer to ensure you're not overpaying
                    for the content you actually want to watch.
                </p>

                <a
                    class="button"
                    href="https://shamikasireddy.github.io/reellyy/"
                >
                    Try Reellyy →
                </a>

            </div>

            <!-- Wander -->
            <div class="card wander-card">

                <div class="icon">🔎</div>

                <div class="wander-content">

                    <h2>Wander</h2>

                    <p class="description">
                        A personalized word search game
                        to share with friends.
                    </p>

                </div>

                <a
                    class="button"
                    href="https://shamikasireddy.github.io/wander/"
                >
                    Play Wander →
                </a>

            </div>

        </main>

        <footer>
            Built with HTML · Hosted on GitHub Pages
        </footer>

    </div>

</body>
</html>
