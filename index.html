<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Made for everyday moments</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            min-height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #718394;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;

            /* Soft blue sky background so the clouds stand out */
            background:
                radial-gradient(
                    circle at 50% 5%,
                    rgba(255, 218, 83, 0.55),
                    rgba(255, 232, 133, 0.20) 20%,
                    transparent 45%
                ),
                linear-gradient(
                    180deg,
                    #b9d0df 0%,
                    #c9dce7 48%,
                    #b7cfdd 100%
                );
        }

        /* =================================================
           BACKGROUND
           ================================================= */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        /* =================================================
           SOFT SUN
           ================================================= */

        .sun {
            position: absolute;

            width: 380px;
            height: 380px;

            border-radius: 50%;

            top: -205px;
            left: 50%;

            transform: translateX(-50%);

            background:
                radial-gradient(
                    circle,
                    rgba(255, 218, 83, 0.50) 0%,
                    rgba(255, 228, 116, 0.30) 38%,
                    rgba(255, 241, 169, 0.11) 65%,
                    transparent 74%
                );

            filter: blur(4px);
        }

        /* =================================================
           CLOUDS
           ================================================= */

        .cloud {
            position: absolute;

            width: 270px;
            height: 82px;

            /* Brighter clouds against the blue sky */
            background: rgba(255, 255, 255, 0.96);

            border-radius: 100px;

            /* Slightly less blur for clearer cloud shapes */
            filter: blur(2px);

            box-shadow:
                55px 4px 0 rgba(255, 255, 255, 0.92),
                105px -25px 0 rgba(255, 255, 255, 0.94),
                160px 2px 0 rgba(255, 255, 255, 0.88),
                205px 12px 0 rgba(255, 255, 255, 0.82);
        }

        /* Large upper-left cloud */

        .cloud.one {
            left: -125px;
            top: 13%;

            transform: scale(1.25);

            opacity: 0.92;
        }

        /* Large right cloud */

        .cloud.two {
            right: -125px;
            top: 29%;

            transform: scale(1.08);

            opacity: 0.88;
        }

        /* Lower-left cloud */

        .cloud.three {
            left: -45px;
            bottom: 12%;

            transform: scale(0.95);

            opacity: 0.82;
        }

        /* Lower-right cloud */

        .cloud.four {
            right: -35px;
            bottom: 2%;

            transform: scale(0.88);

            opacity: 0.78;
        }

        /* Small floating cloud */

        .cloud.five {
            width: 210px;
            height: 65px;

            right: 17%;
            top: 7%;

            transform: scale(0.75);

            opacity: 0.72;

            filter: blur(3px);

            box-shadow:
                45px 3px 0 rgba(255, 255, 255, 0.70),
                90px -18px 0 rgba(255, 255, 255, 0.74),
                135px 4px 0 rgba(255, 255, 255, 0.66);
        }

        /* =================================================
           SPARKLES
           ================================================= */

        .sparkle {
            position: absolute;

            width: 4px;
            height: 4px;

            border-radius: 50%;

            background: rgba(238, 193, 44, 0.78);

            box-shadow:
                0 0 10px rgba(238, 193, 44, 0.48);

            animation:
                shimmer 5.5s ease-in-out infinite,
                float 8s ease-in-out infinite;
        }

        .sparkle::before,
        .sparkle::after {
            content: "";

            position: absolute;

            background: rgba(238, 193, 44, 0.45);

            border-radius: 100%;
        }

        .sparkle::before {
            width: 1px;
            height: 13px;

            left: 1.5px;
            top: -4.5px;
        }

        .sparkle::after {
            width: 13px;
            height: 1px;

            left: -4.5px;
            top: 1.5px;
        }

        .sparkle.one {
            top: 19%;
            left: 17%;

            animation-delay: 0s;
        }

        .sparkle.two {
            top: 27%;
            right: 21%;

            width: 3px;
            height: 3px;

            animation-delay: 1.4s;
            animation-duration: 7s;
        }

        .sparkle.three {
            top: 45%;
            left: 8%;

            width: 3px;
            height: 3px;

            animation-delay: 2.7s;
            animation-duration: 8s;
        }

        .sparkle.four {
            top: 57%;
            right: 9%;

            width: 4px;
            height: 4px;

            animation-delay: 0.8s;
            animation-duration: 6.5s;
        }

        .sparkle.five {
            top: 73%;
            left: 23%;

            width: 3px;
            height: 3px;

            animation-delay: 3.5s;
            animation-duration: 9s;
        }

        .sparkle.six {
            top: 84%;
            right: 27%;

            width: 3px;
            height: 3px;

            animation-delay: 1.8s;
            animation-duration: 7.5s;
        }

        .sparkle.seven {
            top: 12%;
            left: 34%;

            width: 2px;
            height: 2px;

            animation-delay: 4s;
            animation-duration: 8s;
        }

        .sparkle.eight {
            top: 66%;
            right: 35%;

            width: 2px;
            height: 2px;

            animation-delay: 2.2s;
            animation-duration: 7s;
        }

        @keyframes shimmer {
            0%, 100% {
                opacity: 0.10;
                transform: scale(0.65);
            }

            50% {
                opacity: 0.78;
                transform: scale(1.35);
            }
        }

        @keyframes float {
            0%, 100% {
                margin-top: 0;
            }

            50% {
                margin-top: -8px;
            }
        }

        /* =================================================
           MAIN CONTENT
           ================================================= */

        .container {
            max-width: 900px;
            margin: 0 auto;

            padding: 85px 24px;

            position: relative;
            z-index: 1;
        }

        /* =================================================
           HEADER
           ================================================= */

        header {
            text-align: center;

            margin-bottom: 55px;
        }

        h1 {
            font-family:
                "Arial Rounded MT Bold",
                "Trebuchet MS",
                -apple-system,
                BlinkMacSystemFont,
                sans-serif;

            font-size: 54px;

            font-weight: 800;

            letter-spacing: -1.5px;

            color: #7895aa;

            margin-bottom: 12px;

            text-shadow:
                0 2px 0 rgba(255, 255, 255, 0.95),
                0 5px 14px rgba(120, 149, 170, 0.10);
        }

        .subtitle {
            font-size: 18px;

            color: #687f91;
        }

        /* =================================================
           APP LAYOUT
           ================================================= */

        .apps {
            display: flex;
            flex-direction: column;

            gap: 28px;
        }

        /* =================================================
           JELLY CARDS
           ================================================= */

        .card {
            position: relative;
            overflow: hidden;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.91),
                    rgba(255, 255, 255, 0.63)
                );

            border: 1px solid rgba(255, 255, 255, 0.96);

            border-radius: 32px;

            padding: 40px;

            box-shadow:
                0 22px 45px rgba(126, 145, 157, 0.12),
                0 5px 12px rgba(126, 145, 157, 0.06),
                inset 0 2px 0 rgba(255, 255, 255, 0.98),
                inset 0 -3px 9px rgba(210, 220, 226, 0.18);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        /* Glossy highlight */

        .card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 9%;
            right: 9%;

            height: 3px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 255, 255, 1),
                    transparent
                );

            border-radius: 100%;

            filter: blur(1px);
        }

        /* Internal reflection */

        .card::after {
            content: "";

            position: absolute;

            width: 260px;
            height: 120px;

            top: -75px;
            left: 12%;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.30);

            filter: blur(15px);

            pointer-events: none;
        }

        .card:hover {
            transform: translateY(-6px);

            box-shadow:
                0 28px 55px rgba(126, 145, 157, 0.16),
                0 7px 15px rgba(126, 145, 157, 0.07),
                inset 0 2px 0 rgba(255, 255, 255, 1),
                inset 0 -3px 11px rgba(210, 220, 226, 0.20);
        }

        /* =================================================
           FEATURED REELLYY
           ================================================= */

        .featured {
            padding: 50px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.95),
                    rgba(255, 250, 224, 0.74)
                );
        }

        .yellow-glow {
            position: absolute;

            width: 320px;
            height: 320px;

            border-radius: 50%;

            right: -130px;
            top: -155px;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 218, 83, 0.25),
                    rgba(255, 232, 137, 0.10) 55%,
                    transparent 70%
                );

            filter: blur(6px);

            pointer-events: none;
        }

        /* =================================================
           ICONS
           ================================================= */

        .icon {
            width: 64px;
            height: 64px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 21px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.97),
                    rgba(248, 250, 250, 0.72)
                );

            font-size: 30px;

            margin-bottom: 24px;

            box-shadow:
                0 10px 22px rgba(110, 130, 142, 0.10),
                inset 0 2px 2px rgba(255, 255, 255, 0.98),
                inset 0 -2px 5px rgba(215, 222, 226, 0.16);
        }

        .featured .icon {
            background:
                linear-gradient(
                    145deg,
                    #fff6bf,
                    #ffd94d
                );

            box-shadow:
                0 12px 24px rgba(235, 194, 55, 0.20),
                inset 0 2px 3px rgba(255, 255, 255, 0.84),
                inset 0 -2px 5px rgba(220, 177, 35, 0.12);
        }

        /* =================================================
           TYPOGRAPHY
           ================================================= */

        h2 {
            font-family:
                "Arial Rounded MT Bold",
                "Trebuchet MS",
                -apple-system,
                BlinkMacSystemFont,
                sans-serif;

            font-size: 32px;

            font-weight: 750;

            letter-spacing: -0.7px;

            color: #7895aa;

            margin-bottom: 10px;
        }

        .description {
            color: #778692;

            line-height: 1.65;

            font-size: 17px;

            max-width: 650px;

            margin-bottom: 28px;
        }

        /* =================================================
           JELLY BUTTONS
           ================================================= */

        .button {
            display: inline-block;

            background:
                linear-gradient(
                    145deg,
                    #ffe97a,
                    #ffd43d
                );

            color: #554b29;

            text-decoration: none;

            padding: 13px 23px;

            border-radius: 16px;

            font-weight: 750;

            box-shadow:
                0 8px 18px rgba(231, 188, 43, 0.18),
                inset 0 2px 2px rgba(255, 255, 255, 0.72),
                inset 0 -2px 3px rgba(215, 169, 25, 0.10);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .button:hover {
            transform: translateY(-2px);

            background:
                linear-gradient(
                    145deg,
                    #ffed8c,
                    #ffda50
                );

            box-shadow:
                0 11px 24px rgba(231, 188, 43, 0.24),
                inset 0 2px 2px rgba(255, 255, 255, 0.8),
                inset 0 -2px 3px rgba(215, 169, 25, 0.10);
        }

        /* =================================================
           WANDER
           ================================================= */

        .wander-card {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 30px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.91),
                    rgba(255, 255, 255, 0.66)
                );
        }

        .wander-content {
            flex: 1;
        }

        .wander-card h2 {
            font-size: 28px;
        }

        .wander-card .description {
            margin-bottom: 0;
        }

        .wander-card .button {
            flex-shrink: 0;
        }

        /* =================================================
           FOOTER
           ================================================= */

        footer {
            text-align: center;

            margin-top: 55px;

            color: #718795;

            font-size: 14px;
        }

        /* =================================================
           MOBILE
           ================================================= */

        @media (max-width: 650px) {

            .container {
                padding: 60px 20px;
            }

            h1 {
                font-size: 42px;
            }

            .featured {
                padding: 34px;
            }

            .card {
                border-radius: 27px;
            }

            .wander-card {
                flex-direction: column;
                align-items: flex-start;
            }

            .wander-card .button {
                margin-top: 5px;
            }

            .cloud.three,
            .cloud.four {
                display: none;
            }

            .cloud.five {
                right: -80px;
            }

            .sparkle.five,
            .sparkle.six,
            .sparkle.seven,
            .sparkle.eight {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- =================================================
         BACKGROUND
         ================================================= -->

    <div class="background">

        <div class="sun"></div>

        <div class="cloud one"></div>
        <div class="cloud two"></div>
        <div class="cloud three"></div>
        <div class="cloud four"></div>
        <div class="cloud five"></div>

        <div class="sparkle one"></div>
        <div class="sparkle two"></div>
        <div class="sparkle three"></div>
        <div class="sparkle four"></div>
        <div class="sparkle five"></div>
        <div class="sparkle six"></div>
        <div class="sparkle seven"></div>
        <div class="sparkle eight"></div>

    </div>

    <!-- =================================================
         PORTFOLIO
         ================================================= -->

    <div class="container">

        <header>
            <p class="subtitle">Made for everyday moments</p>
        </header>

        <main class="apps">

            <!-- =================================================
                 REELLYY
                 ================================================= -->

            <div class="card featured">

                <div class="yellow-glow"></div>

                <div class="icon">🎬</div>

                <h2>Reellyy</h2>

                <p class="description">
                    A streaming service optimizer that ensures you're not
                    overpaying for the content you actually want to watch.
                </p>

                <a
                    class="button"
                    href="https://shamikasireddy.github.io/reellyy/"
                >
                    Try Reellyy →
                </a>

            </div>

            <!-- =================================================
                 WANDER
                 ================================================= -->

            <div class="card wander-card">

                <div class="icon">🔎</div>

                <div class="wander-content">

                    <h2>Wander</h2>

                    <p class="description">
                        A personalized word search game
                        to share with friends.
                    </p>

                </div>

                <a
                    class="button"
                    href="https://shamikasireddy.github.io/wander/"
                >
                    Play Wander →
                </a>

            </div>

        </main>

        <footer>
            Built with HTML · Hosted on GitHub Pages
        </footer>

    </div>

</body>
</html>
